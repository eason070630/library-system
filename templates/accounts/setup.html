{% extends 'base.html' %}
{% block title %}First-time setup{% endblock %}
{% block content %}
<div class="card form-card mx-auto"><div class="card-body p-4">
  <h1 class="h4 page-title">First-time setup</h1>
  <p class="text-muted">No accounts exist yet. Create the first administrator; it can then create all other accounts.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'includes/form_fields.html' %}
    <button class="btn btn-primary" type="submit"><i class="bi bi-person-plus me-1"></i>Create administrator</button>
  </form>
</div></div>
{% endblock %}
