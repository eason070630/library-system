{% extends 'base.html' %}
{% block title %}Delete role{% endblock %}
{% block content %}
<h1 class="h3 page-title mb-3">Delete Role</h1>
<div class="card form-card border-danger"><div class="card-body"><form method="post">{% csrf_token %}
  <p class="mb-3"><i class="bi bi-exclamation-triangle text-danger me-1"></i>Delete the role <strong>{{ role.name }}</strong>? This cannot be undone.</p>
  <button class="btn btn-danger" type="submit"><i class="bi bi-trash me-1"></i>Yes, delete</button>
  <a class="btn btn-outline-secondary" href="{% url 'accounts:role_list' %}">Cancel</a>
</form></div></div>
{% endblock %}
