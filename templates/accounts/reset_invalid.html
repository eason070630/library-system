{% extends 'base.html' %}
{% block title %}Link expired{% endblock %}
{% block content %}
<div class="card form-card mx-auto text-center"><div class="card-body py-5">
  <i class="bi bi-link-45deg display-3 text-danger"></i>
  <h1 class="h4 mt-2">This reset link is invalid or has expired</h1>
  <p class="text-muted">Links work once and expire after 1 hour.</p>
  <a class="btn btn-primary" href="{% url 'accounts:forgot' %}">Request a new link</a>
</div></div>
{% endblock %}
