{% extends 'base.html' %}
{% block title %}Register · Library System{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7 col-xl-6">
    <div class="card form-card shadow-sm"><div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus display-5 text-primary"></i>
        <h1 class="h3 page-title mt-2">Create your library account</h1>
        <p class="text-muted mb-0">Register once to sign in and use member services.</p>
      </div>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <button class="btn btn-primary w-100 mt-2" type="submit"><i class="bi bi-person-check me-1"></i>Register</button>
      </form>
      <p class="text-center text-muted mt-3 mb-0">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
