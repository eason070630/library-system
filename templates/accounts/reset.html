{% extends 'base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="card form-card mx-auto"><div class="card-body p-4">
  <h1 class="h4 page-title">Choose a new password</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'includes/form_fields.html' %}
    <button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i>Reset password</button>
  </form>
</div></div>
{% endblock %}
