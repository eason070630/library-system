{% extends 'base.html' %}
{% block title %}Edit Book{% endblock %}

{% block content %}

<h1 class="h3 mb-4">Edit Book</h1>

<div class="card">
    <div class="card-body">

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {% include 'includes/form_fields.html' %}

            {% if book.cover_image %}
                <p>Current Cover:</p>
                <img src="{{ book.cover_image.url }}"
                     alt="{{ book.title }}"
                     style="height:130px;object-fit:contain;"
                     class="mb-3">
            {% elif book.cover %}
                <p>Current Cover:</p>
                <img src="{{ book.cover.url }}"
                     alt="{{ book.title }}"
                     style="height:130px;object-fit:contain;"
                     class="mb-3">
            {% endif %}

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a href="{% url 'categories:manage_books' %}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>
            </div>
        </form>

    </div>
</div>

{% endblock %}
