{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1 class="h3 page-title mb-3">{{ title }}</h1>
<div class="card form-card"><div class="card-body">
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'includes/form_fields.html' %}
    <button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i>Save</button>
    <a class="btn btn-outline-secondary" href="{% url 'categories:list' %}">Cancel</a>
  </form>
</div></div>
{% endblock %}
