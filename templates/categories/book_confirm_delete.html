
{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Delete Book</h4>
        </div>

        <div class="card-body">
            <h5>Are you sure you want to delete this book?</h5>

            <p class="mt-3">
                Book title: <strong>{{ book.title }}</strong>
            </p>

            <p class="text-danger">
                This action cannot be undone.
            </p>

            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'categories:manage_books' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
